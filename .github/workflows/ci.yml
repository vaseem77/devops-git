name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run script
        run: |
          chmod +x hello.sh
          ./hello.sh

      - name: Lint with ShellCheck
        run: shellcheck hello.sh
